<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8"
    >
  </head>
  <body>
    <div class="header">
      <img class="header__image" src="./eisenhower-matrix.jpg">
      <a
        class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >Want more details?</a>
    </div>
    <div class="app__container">
      <p id="app__header">
        <label class="app__header__title" for="addTaskInput">Add Item</label>
        <div class="app__header__content">
          <input
            id="addTaskInput"
            class="app__header__input"
            type="text"
          >
          <button class="app__button app__header__button">Add</button>
        </div>
      </p>
      <h3 class="app__heading">Todo</h3>
      <ul id="incompleted-tasks" class="app__list">
        <li class="app__list-item">
          <input class="app__task-checkbox" type="checkbox">
          <label class="app__task-label">Pay Bills</label>
          <input
            type="text"
            class="app__task-input"
          >
          <button class="app__button app__edit-button" >Edit</button>
          <button class="app__button app__delete-button">
            <img src="./remove.svg">
          </button>
        </li>
        <li class="app__list-item app__list-item_edit">
          <input class="app__task-checkbox" type="checkbox">
          <label class="app__task-label">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="app__task-input"
          >
          <button class="app__button app__edit-button">Save</button>
          <button class="app__button app__delete-button">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3 class="app__heading">Completed</h3>
      <ul id="completed-tasks" class="app__list">
        <li class="app__list-item">
          <input
            class="app__task-checkbox"
            type="checkbox"
            checked
          >
          <label class="app__task-label">See the Doctor</label>
          <input
            type="text"
            class="app__task-input"
          >
          <button class="app__button app__edit-button">Edit</button>
          <button class="app__button app__delete-button">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
